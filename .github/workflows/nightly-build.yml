name: Maslow OS Preview ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Maslow OS source
        uses: actions/checkout@v4
        with:
          repository: letsgomaslow/maslow-os
          ref: maslow
          path: maslow-source

      - name: Checkout Maslow OS packages
        uses: actions/checkout@v4
        with:
          repository: letsgomaslow/maslow-os-pkgs
          ref: maslow
          path: maslow-pkgs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Run VM-free tests
        run: |
          ./test/maslow-branding
          ./test/all

      - name: Build ISO
        run: |
          NO_BOOT_OFFER=1 ./bin/omarchy-iso-make --local-source \
            "$GITHUB_WORKSPACE/maslow-source" \
            "$GITHUB_WORKSPACE/maslow-pkgs"

      - name: Delete previously uploaded ISO artifact
        uses: philips-labs/action-delete-artifacts@v1.0.0
        with:
          workflow: nightly-build.yml
        continue-on-error: true

      - name: Upload newly built ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: maslow-os-preview-${{ github.run_number }}
          path: ./release/*.iso
          retention-days: 1
